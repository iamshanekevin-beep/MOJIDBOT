services:
  setup:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - deps:/deps
    command: sh -c "pip install --no-cache-dir --target=/deps -r requirements.txt"

  bot:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - logs:/logs
      - deps:/deps
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PYTHONPATH=/deps
      - ACCOUNT_TYPE=PRACTICE
    command: sh bot_runner.sh
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - logs:/logs
      - deps:/deps
    ports:
      - "3000:3000"
    environment:
      - BOT_LOG_FILE=/logs/bot.log
      - BOT_CONTROL_FILE=/logs/control.json
      - PYTHONPATH=/deps
    command: python -u log_viewer.py
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  logs:
  deps:
