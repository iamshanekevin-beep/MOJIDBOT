services:
  bot:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - logs:/logs
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -u main.py 2>&1 | tee /logs/bot.log"
    restart: unless-stopped

  web:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
      - logs:/logs
    ports:
      - "3000:3000"
    environment:
      - BOT_LOG_FILE=/logs/bot.log
      - BOT_CONTROL_FILE=/logs/control.json
    command: python -u log_viewer.py
    restart: unless-stopped
    depends_on:
      - bot

volumes:
  logs:
