services:
  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - /run/base44/app.env
    environment:
      - ACCOUNT_TYPE=PRACTICE
      - AUTO_TRADE=false
      - PAIR=EURUSD-OTC
      - TIMEFRAME_SECONDS=60
      - CANDLE_COUNT=100
      - EXPIRATION_MINUTES=1
      - STRATEGY=BOTH
      - POLL_SECONDS=5
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    restart: unless-stopped
